plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

version = '0.4.0-alpha.1'
group = 'local.companion'
base { archivesName = 'companion-selector-26.2' }

repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.159.0+26.2'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    runs {
        client {
            client()
            runDir '../work/fabric-client'
            if (project.hasProperty('testServer')) {
                runDir '../work/vision-client'
                programArgs '--quickPlayMultiplayer', project.property('testServer'), '--username', 'VisionObserver'
                vmArg '-Dcompanion.visionTest=true'
            }
            programArgs '--width', '1280', '--height', '800'
            if (project.hasProperty('assetsDir')) { programArgs '--assetsDir', project.property('assetsDir'), '--assetIndex', '32' }
            if (project.hasProperty('selectorPreview')) {
                vmArg '-Dcompanion.selectorPreview=true'
            }
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    def originalEdition = project.findProperty('characterEdition') == 'originals'
    inputs.property 'characterEdition', originalEdition ? 'originals' : 'personal'
    filesMatching('fabric.mod.json') { expand version: project.version }
    if (originalEdition) {
        exclude 'assets/companion/textures/skins/yanro.png', 'assets/companion/textures/skins/gpchan.png',
            'assets/companion/textures/skins/doro.png', 'assets/companion/textures/skins/gemchan.png', 'assets/companion/textures/skins/spiki.png'
        doLast {
            def catalogFile = new File(destinationDir, 'assets/companion/characters.json')
            def catalog = new groovy.json.JsonSlurper().parse(catalogFile)
            catalog.characters = catalog.characters.findAll { it.id in ['clchan', 'fablechan'] }
            catalogFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(catalog)) + '\n', 'UTF-8')
        }
    }
}
